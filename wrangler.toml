name = "mnemonify-editor"
main = "worker/index.js"
compatibility_date = "2026-08-16"

[assets]
directory = "./packages/editor/dist"
binding = "ASSETS"
run_worker_first = [
  "/api",
  "/api/*",
  "/uploads",
  "/uploads/*",
  "/player",
  "/player/*",
  "/player-assets",
  "/player-assets/*",
  "/share",
  "/share/*",
  "/content",
  "/content/*",
]
