name = "mnemonify-editor"
main = "index.js"
compatibility_date = "2026-08-16"

[assets]
directory = "../packages/editor/dist"
not_found_handling = "single-page-application"
binding = "ASSETS"
run_worker_first = [
  "/api",
  "/api/*",
  "/uploads",
  "/uploads/*",
  "/player",
  "/player/*",
  "/player-assets",
  "/player-assets/*",
  "/share",
  "/share/*",
  "/content",
  "/content/*",
]
